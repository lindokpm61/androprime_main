<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>LOADING</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#e9e9e6}canvas{display:block}</style>
</head>
<body>
<script type="importmap">
{ "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q   = new URLSearchParams(location.search);
const SHOT = q.get('shot') || 'group';
const W = parseInt(q.get('w') || '1400', 10);
const H = parseInt(q.get('h') || '1100', 10);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const MAXA = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e9e6);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(-90, 160, 130);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
const d = 160;
key.shadow.camera.left = -d; key.shadow.camera.right = d;
key.shadow.camera.top = d;   key.shadow.camera.bottom = -d;
key.shadow.camera.near = 1;  key.shadow.camera.far = 600;
key.shadow.bias = -0.0008;
key.shadow.radius = 3;
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.45); fill.position.set(150, 70, 120); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.ShadowMaterial({ opacity: 0.20 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- materials ----------
const loader = new THREE.TextureLoader();
function tex(url, repeatX) {
  const t = loader.load(url);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAXA;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  if (repeatX) { t.wrapS = THREE.RepeatWrapping; }
  return t;
}
const matHDPE = new THREE.MeshPhysicalMaterial({
  color: 0xf4f4f2, roughness: 0.62, metalness: 0.0, clearcoat: 0.18, clearcoatRoughness: 0.5 });
const matPET = new THREE.MeshPhysicalMaterial({
  color: 0xf6f6f4, roughness: 0.34, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.18 });
const matCapWhite = new THREE.MeshPhysicalMaterial({
  color: 0xf2f2f0, roughness: 0.5, metalness: 0.0, clearcoat: 0.2 });
const matPETBlack = new THREE.MeshPhysicalMaterial({
  color: 0x121212, roughness: 0.30, metalness: 0.0, clearcoat: 0.62, clearcoatRoughness: 0.14 });
const matCapBlack = new THREE.MeshPhysicalMaterial({
  color: 0x141414, roughness: 0.44, metalness: 0.0, clearcoat: 0.25 });
const matCapChrome = new THREE.MeshStandardMaterial({
  color: 0xd8dade, roughness: 0.14, metalness: 1.0 });
function matLabel(url, repeatX) {
  return new THREE.MeshStandardMaterial({
    map: tex(url, repeatX), roughness: 0.72, metalness: 0.0 });
}

// ---------- flat mail packer (150 ml, 75 x 94 x 25 mm) ----------
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w/2, y = -h/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);      s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);      s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);          s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function flatPacker() {
  const g = new THREE.Group();
  const BW = 75, BH = 94, BD = 19, BT = 3;   // + 2*bevel = 25 mm total depth

  const bodyGeo = new THREE.ExtrudeGeometry(roundedRectShape(BW, BH, 13), {
    depth: BD, bevelEnabled: true, bevelThickness: BT, bevelSize: BT, bevelSegments: 8, curveSegments: 32
  });
  bodyGeo.translate(0, 0, -(BD/2));            // centre depth on z=0
  const body = new THREE.Mesh(bodyGeo, matHDPE);
  body.castShadow = true; body.receiveShadow = true;
  body.position.y = BH/2;
  g.add(body);

  // neck: short rounded slab
  const neckGeo = new THREE.ExtrudeGeometry(roundedRectShape(52, 11, 4), {
    depth: 15, bevelEnabled: true, bevelThickness: 2, bevelSize: 2, bevelSegments: 4, curveSegments: 16 });
  neckGeo.translate(0, 0, -7.5);
  const neck = new THREE.Mesh(neckGeo, matHDPE);
  neck.position.y = BH - 1; neck.castShadow = true;
  g.add(neck);

  // clip-on lid: wide flat cap
  const lidGeo = new THREE.ExtrudeGeometry(roundedRectShape(54, 13, 5), {
    depth: 19, bevelEnabled: true, bevelThickness: 2.5, bevelSize: 2.5, bevelSegments: 5, curveSegments: 16 });
  lidGeo.translate(0, 0, -9.5);
  const lid = new THREE.Mesh(lidGeo, matCapWhite);
  lid.position.y = BH + 6; lid.castShadow = true;
  g.add(lid);

  // labels: 65 x 80 mm, flat on the front and back faces
  const fz = BD/2 + BT;                        // flat face plane
  const front = new THREE.Mesh(new THREE.PlaneGeometry(65, 80), matLabel('/tex/fp-front.png'));
  front.position.set(0, BH/2 + 1, fz + 0.12);
  g.add(front);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(65, 80), matLabel('/tex/fp-back.png'));
  back.position.set(0, BH/2 + 1, -(fz + 0.12));
  back.rotation.y = Math.PI;
  g.add(back);

  g.userData.height = BH + 19;
  return g;
}

// ---------- PET round bottle (203 mm circumference => r 32.31) ----------
function petBottle(chrome, turn, opts) {
  turn = turn || 0; opts = opts || {};
  const bodyMat = opts.black ? matPETBlack : matPET;
  const capMat  = chrome ? matCapChrome : (opts.black ? matCapBlack : matCapWhite);
  const labUrl  = opts.labelUrl || '/tex/pet-wrap.png';
  const g = new THREE.Group();
  const R = 32.31;
  const pts = [
    [0, 0], [R - 3, 0], [R, 3],
    [R, 96], [R - 1.2, 102], [R - 7, 109.5], [R - 15, 115.5], [R - 17.6, 119],
    [15.4, 121], [15.4, 129]
  ].map(p => new THREE.Vector2(p[0], p[1]));
  const bodyGeo = new THREE.LatheGeometry(pts, 96);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(17.6, 17.6, 17, 96, 1, false),
    capMat);
  cap.position.y = 127.5; cap.castShadow = true;
  g.add(cap);
  const capTop = new THREE.Mesh(new THREE.TorusGeometry(16.8, 1.0, 8, 48), capMat);
  capTop.rotation.x = Math.PI/2; capTop.position.y = 135.4; g.add(capTop);

  // wrap label: open cylinder just proud of the wall, 90 mm tall
  const labGeo = new THREE.CylinderGeometry(R + 0.14, R + 0.14, 90, 128, 1, true);
  const lab = new THREE.Mesh(labGeo, matLabel(labUrl, true));
  lab.material.side = THREE.FrontSide;
  lab.position.y = 4 + 45;
  // u=0 sits at +Z; bring the front-field centre (u=0.3153) round to face the camera,
  // then undo the group turn so the framing stays put
  lab.rotation.y = -(0.240 * Math.PI * 2) - turn;
  g.add(lab);

  g.userData.height = 141;
  return g;
}

// ---------- assemble the shot ----------
const camera = new THREE.PerspectiveCamera(22, W / H, 1, 3000);
let target = new THREE.Vector3(0, 55, 0);

function place(obj, x, ry) { obj.position.x = x; obj.rotation.y = ry; scene.add(obj); return obj; }

function cam(dir, dist, tgt) {
  const v = new THREE.Vector3(dir[0], dir[1], dir[2]).normalize().multiplyScalar(dist);
  target.set(tgt[0], tgt[1], tgt[2]);
  camera.position.copy(target).add(v);
}

if (SHOT === 'packer') {
  place(flatPacker(), 0, -0.26);
  cam([0.30, 0.15, 1], 430, [0, 56, 0]);
} else if (SHOT === 'packer-back') {
  const p = flatPacker(); p.rotation.y = Math.PI + 0.26; scene.add(p);
  cam([-0.30, 0.15, 1], 430, [0, 56, 0]);
} else if (SHOT === 'pet-white') {
  place(petBottle(false, -0.12), 0, -0.12);
  cam([0.26, 0.13, 1], 530, [0, 66, 0]);
} else if (SHOT === 'pet-chrome') {
  place(petBottle(true, -0.12), 0, -0.12);
  cam([0.26, 0.13, 1], 530, [0, 66, 0]);
} else if (SHOT === 'pet-hero-white') {
  place(petBottle(false, -0.07), 0, -0.07);
  cam([0.13, 0.11, 1], 520, [0, 64, 0]);
} else if (SHOT === 'pet-hero-black') {
  place(petBottle(false, -0.07, {black:true}), 0, -0.07);
  cam([0.13, 0.11, 1], 520, [0, 64, 0]);
} else if (SHOT === 'pet-hero-black-rev') {
  place(petBottle(false, -0.07, {black:true, labelUrl:'/tex/pet-wrap-invert.png'}), 0, -0.07);
  cam([0.13, 0.11, 1], 520, [0, 64, 0]);
} else { // group
  place(flatPacker(), -114, -0.26);
  place(petBottle(false, -0.12), 4, -0.12);
  place(petBottle(true, -0.12), 118, -0.12);
  cam([0.06, 0.16, 1], 690, [0, 62, 0]);
}
camera.lookAt(target);

// ---------- render once everything has loaded ----------
THREE.DefaultLoadingManager.onLoad = () => {
  renderer.render(scene, camera);
  document.title = 'DONE ' + SHOT;
};
setTimeout(() => { renderer.render(scene, camera); }, 2500);
</script>
</body>
</html>
