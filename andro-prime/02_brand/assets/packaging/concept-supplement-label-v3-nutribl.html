<script>
// Texture export: file.html?face=fp-front&w=1300&h=1600&theme=mono
(function(){
  const q = new URLSearchParams(location.search);
  const face = q.get('face');
  if (!face) return;
  const w = parseInt(q.get('w')||'1300',10), h = parseInt(q.get('h')||'1600',10);
  const theme = q.get('theme')==='ivory' ? 'theme-ivory' : 'theme-mono';
  document.body.className = 'export';
  const vb = face.startsWith('fp') ? '0 0 650 800' : '0 0 650 800';
  document.getElementById('exporthost').innerHTML =
    '<div class="'+theme+'"><svg class="fp" width="'+w+'" height="'+h+'" viewBox="'+vb+'">' +
    '<use href="#'+face+'" width="650" height="800"/></svg></div>';
})();
</script>
