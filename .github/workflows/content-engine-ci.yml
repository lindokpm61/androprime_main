# CI for the content-engine tooling.
#
# WHY THIS EXISTS. Until 2026-08-02 nothing ran these suites automatically. The production build
# type-checked the tooling scripts as a side effect, so a broken script surfaced as a failed
# deploy: an accidental guard, but a guard. Excluding the scripts from the Next tsconfig (the fix
# for a build break that same day) removed it, and left `npm test` as the only thing that checks
# them, run by hand or not at all.
#
# These three suites are DELIBERATELY OFFLINE. They read fixtures and one repo file (scan.js) and
# touch neither the database nor any API, so this workflow needs no secrets. That is why it can
# run on every push instead of nightly.
name: content-engine CI

on:
  push:
    branches: [main]
    paths:
      - 'andro-prime/09_website-app/frontend/scripts/content-engine/**'
      - 'andro-prime/09_website-app/frontend/tsconfig*.json'
      - 'andro-prime/09_website-app/frontend/package.json'
      - '.claude/skills/content-status/**'
      - '.github/workflows/content-engine-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andro-prime/09_website-app/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: andro-prime/09_website-app/frontend/package-lock.json

      - run: npm ci

      # The scripts are no longer type-checked by `next build`, so this is now the only
      # automatic check on them.
      - name: Typecheck the content-engine scripts
        run: npm run typecheck:scripts

      # Includes the guard that no static import escapes the Docker build context. That check is
      # structural on purpose: the import which broke production on 2026-08-02 passed `tsc` AND a
      # full local `next build`, because both see the whole repo and the deploy image does not.
      - name: content-doctor suite
        run: npx tsx scripts/content-engine/test-content-doctor.ts

      - name: content-sync suite
        run: npx tsx scripts/content-engine/test-content-sync.ts

      - name: content-doctor-cron suite
        run: npx tsx scripts/content-engine/test-content-doctor-cron.ts

      # Guards the only script permitted to record a clinical sign-off. Its highest-value case is
      # the entry-point guard, which is not theoretical: the first version matched on a filename
      # SUFFIX, `test-signoff-sync.ts` satisfied it, and running the test suite executed the sync
      # against production (2026-08-04).
      - name: signoff-sync suite
        run: npx tsx scripts/content-engine/test-signoff-sync.ts

      # Guards the only script that can post to a live public social account. Same entry-point
      # trap as signoff-sync above, with a worse blast radius: a suffix match here publishes a
      # post rather than writing a database row.
      - name: metricool-schedule suite
        run: npx tsx scripts/content-engine/test-metricool-schedule.ts

      # Guards the absence detector. It is the only thing that can report the DOCTOR'S OWN death
      # rather than its findings, and it exists because on 2026-08-01 the nightly doctor was
      # registered and then did not run for four nights while every alarm route (all of which
      # lived inside it) stayed silent.
      - name: doctor-heartbeat suite
        run: npx tsx scripts/content-engine/test-doctor-heartbeat.ts

      # Guards the MDX -> Substack converter behind `--full`. A republish is claim-clean only
      # because it reproduces a signed article exactly, so this suite is mostly about what must
      # NOT be dropped: the GP safety-netting panel and the clinical attribution both live in
      # MDX component attributes, and losing them makes the issue less safe than its source
      # while still looking like clean output.
      - name: substack-draft converter suite
        run: npx tsx scripts/content-engine/test-substack-draft.ts
